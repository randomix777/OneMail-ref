[package]
name = "onemail-desktop"
version.workspace = true
edition.workspace = true
description = "OneMail desktop shell"

[lib]
name = "onemail_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2.7.4"

[dependencies]
base64 = "0.23.1"
dirs = "7.0.0"
mail-imap = { version = "0.1.0", path = "../../../crates/mail-imap" }
mail-ipc = { version = "0.1.0", path = "../../../crates/mail-ipc" }
mail-smtp = { version = "0.1.0", path = "../../../crates/mail-smtp" }
mail-store = { version = "0.1.0", path = "../../../crates/mail-store" }
mail-vault = { version = "0.1.0", path = "../../../crates/mail-vault" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tauri = "2.12.5"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1.54.1", features = ["sync", "net", "io-util", "time"] }
url = "2.5.7"
uuid = { version = "1.29.0", features = ["v4"] }
